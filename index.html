<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="나를 이해하고, 나다운 방향을 찾아가는 자기이해와 성장 기록 공간">
  <title>FIND YOUR WAY — 나를 이해하는 시간</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="home" aria-label="FIND YOUR WAY 홈">
        <span class="brand-mark">F</span>
        <span>
          <strong>FIND YOUR WAY</strong>
          <small>YOUR PERSONAL SPACE</small>
        </span>
      </a>

      <div class="side-label">MY SPACE</div>

      <nav class="nav-list" aria-label="주요 메뉴">
        <button class="nav-item active" data-page="home"><span>⌂</span> 홈</button>
        <button class="nav-item" data-page="self"><span>◎</span> 나를 탐색하기</button>
        <button class="nav-item" data-page="emotion"><span>♡</span> 감정 이해하기</button>
        <button class="nav-item" data-page="thought"><span>◈</span> 생각 탐색하기</button>
        <button class="nav-item" data-page="values"><span>✧</span> 나의 가치관</button>
        <button class="nav-item" data-page="career"><span>⌁</span> 진로 탐색</button>
        <button class="nav-item" data-page="action"><span>↗</span> 목표와 실천</button>
        <button class="nav-item" data-page="journal"><span>▤</span> 나의 일기</button>
        <button class="nav-item" data-page="growth"><span>◷</span> 성장 리포트</button>
        <button class="nav-item" data-page="future"><span>☆</span> 미래의 나</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span>⚙</span> 설정 및 데이터</button>
        <div class="privacy-mini">
          <span class="privacy-dot"></span>
          내 기기에 저장되는 개인 공간
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menuToggle" aria-label="메뉴 열기">☰</button>

        <div class="breadcrumb">
          MY SPACE <span>/</span> <strong id="pageName">홈</strong>
        </div>

        <div class="top-actions">
          <span class="today-label" id="todayLabel"></span>
          <button class="avatar" data-page="settings" aria-label="설정">나</button>
        </div>
      </header>

      <section id="app" class="page-content" aria-live="polite"></section>

      <footer class="footer-note">
        FIND YOUR WAY <span>·</span> 나를 이해하는 일은 나만의 속도로
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
